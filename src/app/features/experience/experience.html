<section id="experience" class="experience-section" aria-labelledby="experience-title">
  <div class="experience-container">

    <h2 id="experience-title" class="section-title">Experience</h2>
    <p class="section-subtitle">Internships and projects across software, automation and IoT</p>

    <ol class="timeline" role="list">
      @for (exp of experiences; track exp.company + exp.start) {
        <li class="timeline__item">
          <span class="timeline__dot" aria-hidden="true">
            <span class="timeline__dot-inner"></span>
          </span>
          <app-experience-card [item]="exp" />
        </li>
      }
    </ol>

  </div>
</section>
