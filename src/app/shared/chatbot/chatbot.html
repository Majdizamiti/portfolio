<!-- Floating Trigger Button -->
<button class="chat-trigger" (click)="toggleChat()" [class.active]="isOpen()" aria-label="Toggle Majdi AI Assistant">
  <div class="trigger-icon">
    <svg *ngIf="!isOpen()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <svg *ngIf="isOpen()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </div>
  <span class="trigger-label" *ngIf="!isOpen()">Ask Majdi AI</span>
</button>

<!-- Chat Window Drawer -->
<div class="chat-window" [class.open]="isOpen()">

  <!-- Chat Header -->
  <div class="chat-header">
    <div class="bot-info">
      <div class="bot-avatar">🤖</div>
      <div class="bot-text">
        <h3 class="bot-title">Majdi AI Assistant</h3>
        <p class="bot-status"><span class="status-dot"></span> Online · Knowledge Base</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" (click)="toggleChat()" title="Close chat">
        ✕
      </button>
    </div>
  </div>

  <!-- Messages Body -->
  <div class="chat-body" #scrollContainer>
    <div class="msg-wrapper" *ngFor="let msg of messages()" [class.user]="msg.role === 'user'" [class.assistant]="msg.role === 'assistant'">
      <div class="msg-avatar" *ngIf="msg.role === 'assistant'">🤖</div>
      <div class="msg-bubble">
        <p class="msg-content">{{ msg.content }}</p>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div class="msg-wrapper assistant" *ngIf="isTyping() && !messages()[messages().length - 1]?.content">
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- Quick Question Suggestions -->
    <div class="quick-questions" *ngIf="messages().length <= 2 && !isTyping()">
      <p class="quick-label">Suggested Questions:</p>
      <div class="quick-chips">
        <button class="quick-chip" *ngFor="let q of quickQuestions" (click)="sendQuickQuestion(q)">
          {{ q }}
        </button>
      </div>
    </div>
  </div>

  <!-- Input Bar -->
  <div class="chat-footer">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      placeholder="Ask a question about Majdi..."
      class="chat-input"
      [disabled]="isTyping()"
    />
    <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput().trim() || isTyping()" aria-label="Send message">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>
